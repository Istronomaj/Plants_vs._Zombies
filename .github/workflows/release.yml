name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            preset: ci-linux-gcc
          - name: macos
            os: macos-14
            preset: ci-macos
          - name: windows
            os: windows-2022
            preset: ci-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Install
        run: cmake --install build/${{ matrix.preset }} --prefix dist --config Release

      # The previous release job shipped archives with no assets at all,
      # because every asset-copy step in the build was commented out.
      - name: Verify the archive is runnable
        shell: bash
        run: |
          test -f dist/bin/assets/map.png || { echo "::error::assets missing"; exit 1; }
          test -f dist/bin/assets/main_font.ttf || { echo "::error::font missing"; exit 1; }
          ls -R dist

      - name: Create archive
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../pvz-${{ matrix.name }}.zip" ./*
          else
            tar czf "../pvz-${{ matrix.name }}.tar.gz" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pvz-${{ matrix.name }}
          path: pvz-${{ matrix.name }}.*

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.0.8
        with:
          files: |
            pvz-*.zip
            pvz-*.tar.gz
          generate_release_notes: true
